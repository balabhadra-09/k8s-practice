apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app

    spec:
      containers:
        - name: react-container
          image: balabhadra12/my-react-app-multistage:v1
          ports:
            - containerPort: 80
